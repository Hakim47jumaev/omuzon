{% extends 'customadmin/base.html' %}

{% block title %}{{ title }} - Custom Admin{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<div style="background: linear-gradient(135deg, #fed7d7 0%, #fc8181 20%); padding: 25px; border-radius: 8px; margin-bottom: 25px; border-left: 4px solid #f56565;">
    <p style="margin-bottom: 12px; color: #742a2a; font-size: 16px;">Are you sure you want to delete this {{ model_name }}?</p>
    <p style="margin-bottom: 0; color: #742a2a; font-size: 18px; font-weight: 600;"><strong>{{ object }}</strong></p>
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
